[package]
name = "pixelstatus-companion"
version = "0.2.0"
description = "Tray companion for the ESP8266 pixel status display"
edition = "2021"

[lib]
name = "pixelstatus_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serialport = "4"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["time", "rt"] }
# PKCE fuer den Browser-Login (Authorization-Code-Flow mit Loopback-Redirect):
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Mikrofon-Erkennung fuer Auto-Status: macOS via CoreAudio (Framework-Link, kein
# Crate noetig), Windows via Registry.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
