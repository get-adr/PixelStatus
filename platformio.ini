; PlatformIO Projektkonfiguration
; ESP8266 + 4x MAX7219 (32x8 LED-Matrix) Pixel Status
;
; Board: NodeMCU v2. Fuer Wemos D1 mini -> env [env:d1_mini] unten nutzen.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Exakt gepinnt statt Caret-Ranges (SEC-10): verhindert, dass ein neues
; Upstream-Release automatisch beim naechsten "pio run" gezogen wird --
; PlatformIO hat kein Lockfile-Konzept wie npm/cargo, das uebernehmen hier
; also die exakten Versionsangaben. Versionen bewusst manuell erhoehen und
; dabei kurz testen, statt sie unbemerkt "mitlaufen" zu lassen.
lib_deps =
    majicdesigns/MD_Parola @ 3.7.5
    majicdesigns/MD_MAX72XX @ 3.5.1
    knolleary/PubSubClient @ 2.8.0

[env:d1_mini]
extends = env:nodemcuv2
board = d1_mini
